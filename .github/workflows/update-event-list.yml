name: Update Event List
on:
  schedule:
    - cron: "00 00 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.3.0
      - run: pnpm install --frozen-lockfile
      - name: Update event list
        run: pnpm --filter @spigot-event-list/downloader run start
      - name: Review and apply event metadata
        run: pnpm --filter @spigot-event-list/downloader run review-updates "$RUNNER_TEMP/description-review" --apply
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Upload description review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: description-review
          path: ${{ runner.temp }}/description-review/
          if-no-files-found: ignore
      - name: Validate updated event data
        run: pnpm test
      - name: Import GPG key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v7.0.0
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.BOT_GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true
      - name: Commit changes
        id: commit
        run: |
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: Update event list"
          git push
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.OSLASH_BOT_GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ${{ steps.import-gpg.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.import-gpg.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.import-gpg.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.import-gpg.outputs.email }}
  deploy:
    if: github.ref == 'refs/heads/master' && needs.update.outputs.commit_sha != ''
    needs: update
    uses: ./.github/workflows/deploy-worker.yml
    with:
      commit_sha: ${{ needs.update.outputs.commit_sha }}
    secrets:
      CLOUDFLARE_WORKERS_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_HOOK }}
