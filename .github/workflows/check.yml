name: Check
on:
  - push
  - pull_request
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Install Dependencies
        run: |
          npm install
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Type check
        run: |
          npx tsc -p tsconfig.json --noEmit
          npx tsc -p packages/downloader/tsconfig.json --noEmit
